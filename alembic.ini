# Configuración de Alembic.
#
# `sqlalchemy.url` se deja vacío a propósito: la URL sale de `settings.DATABASE_URL`
# en migrations/env.py, para que no haya dos sitios donde configurar la base de datos
# y acabar migrando una mientras la app usa otra.

[alembic]
script_location = migrations
prepend_sys_path = .
# Fecha delante del nombre: al listar el directorio, el orden es el cronológico.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
